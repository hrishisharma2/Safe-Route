{% extends "base.html" %}
{% block title %}Log in · DISHA{% endblock %}
{% block content %}
<form class="panel auth" method="post">
  <h1>Log in</h1>
  <div class="field"><label for="username">Username</label>
    <input id="username" name="username" required autofocus autocomplete="username"></div>
  <div class="field"><label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password"></div>
  <button class="btn primary" type="submit">Log in</button>
  <p class="note">No account? <a href="{{ url_for('register') }}">Create one</a></p>
</form>
{% endblock %}
